# 一键部署到自己的云服务器(VPS)
# 在仓库 Settings → Secrets and variables → Actions 添加:
#   VPS_HOST      = 服务器公网 IP
#   VPS_USER      = SSH 用户名(默认 root)
#   VPS_PORT      = SSH 端口(默认 22)
#   VPS_SSH_KEY   = SSH 私钥(PEM 全文)
#   VPS_PATH      = 远程部署目录,如 /opt/douyin-cloud-streak

name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to server (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude .git --exclude .venv --exclude data --exclude __pycache__
          path: ./
          remote_path: ${{ secrets.VPS_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install & start service on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            sudo bash deploy/deploy.sh
            echo "--- 服务状态 ---"
            systemctl status douyin-cloud-streak --no-pager | head -n 8 || true